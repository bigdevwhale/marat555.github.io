<div class="hero">
  <div class="hero-avatar-wrap">
    {% include image.html path=site.thumbnail_path alt=site.name class="hero-avatar" %}
  </div>
  <div class="hero-body">
    <p class="hero-prompt mono h5"><span class="hero-dollar">$</span> whoami</p>
    <h1 class="hero-name">{{ site.name }}</h1>
    <p class="hero-role mono h5">full-stack developer</p>
  </div>
</div>
